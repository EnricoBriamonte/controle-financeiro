services:
  db:
    image: postgres:16-alpine
    container_name: controle-financeiro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle-financeiro-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/controle_financeiro
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: chave-local-de-desenvolvimento-trocar-em-producao

volumes:
  db-data:
