# Nome da aplicação
spring.application.name=controle-financeiro

# Profile ativo: "dev" (padrão, usa H2) ou "prod" (usa PostgreSQL).
# Em produção, defina a variável de ambiente SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Banco de dados H2 (em memória, reseta a cada execução) ---
# Usado apenas quando o profile ativo é "dev"
spring.datasource.url=jdbc:h2:mem:financas_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, pra você visualizar as tabelas no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria/atualiza as tabelas automaticamente a partir das entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta: Render/Railway injetam a variável PORT automaticamente em produção
server.port=${PORT:8080}
