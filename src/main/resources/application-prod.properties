# Configuração usada apenas quando SPRING_PROFILES_ACTIVE=prod
# Os valores vêm de variáveis de ambiente definidas na plataforma de deploy
# (Render, Railway, etc) — nunca deixe senha de banco escrita direto no código!

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desliga o console do H2 em produção (não faz sentido, e é um risco de segurança)
spring.h2.console.enabled=false
